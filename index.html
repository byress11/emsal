<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Emsal Hesaplama (Byres)</title>
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📐</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📐</text></svg>">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
  <style>
    /* Add basic fallback styles in case Tailwind fails to load */
    body { font-family: system-ui, -apple-system, sans-serif; }
    .hidden { display: none !important; }
    .text-red-500 { color: #ef4444; }
    .bg-gray-50 { background-color: #f9fafb; }
  </style>
  <script>
    // Suppress Tailwind CDN warning in console
    window.tailwindConfig = {
      corePlugins: {
        preflight: true,
      }
    };

    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#DC2626',
              50: '#fee2e2',
              100: '#fecaca',
              200: '#fca5a5',
              300: '#f87171',
              400: '#ef4444',
              500: '#dc2626',
              600: '#b91c1c',
              700: '#991b1b',
              800: '#7f1d1d',
              900: '#651010',
            },
            anthracite: {
              DEFAULT: '#2D3436',
              50: '#e8e9ea',
              100: '#d1d3d5',
              200: '#a3a7ab',
              300: '#757b81',
              400: '#474f57',
              500: '#2d3436',
              600: '#24292b',
              700: '#1b1f20',
              800: '#121516',
              900: '#090a0b',
            },
            success: {
              DEFAULT: '#0ea5e9',
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            },
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 dark:bg-anthracite-800 transition-colors duration-200">
  <div id="app" class="w-full max-w-5xl mx-auto mt-2 sm:mt-4 px-2 sm:px-4 pb-4 sm:pb-8 text-gray-900 dark:text-gray-100"></div>

  <script>
    // Detect dark mode preference
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.classList.add('dark');
    }
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
      if (event.matches) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    });

    // Constants and helper functions
    const C = { 
      SC: 0.1, 
      MIN: 30, 
      OPT: ["1+1", "2+0", "2+1", "3+1", "4+1", "TİCARİ"] 
    };
    
    // Helper functions
    const roundToFive = num => Math.ceil(num / 5) * 5;
    const calculateBrut = net => roundToFive(net * 1.18 + 12);
    const getType = net =>
      net >= C.MIN
        ? net < 50 ? "1+1" : net < 78 ? "2+0" : net < 98 ? "2+1" : net < 150 ? "3+1" : "4+1"
        : "Geçersiz";

    // Debounce function for performance optimization
    function debounce(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    }
    
    // Format alternative string
    const formatAlternative = (alt, i, k, arr) => {
      let s = `Alternatif ${i + 1}: (${k} kat) -- ${alt.brutArea} m² den ${alt.type}, ${alt.totalUnits} daire`;
      if (arr?.length)
        s += " " + arr
          .map(o =>
            o.daireType === "TİCARİ"
              ? `ve ${o.netAlan} m² ticari net alan çıkar`
              : `ve ${o.brutAlan} m² den ${o.daireType}, ${o.daireSayisi} daire çıkar`
          ).join(" ");
      s = s.trim();
      if (!s.endsWith('çıkar')) {
        s += ' çıkar';
      }
      return s;
    };
    
    // LocalStorage for persistent data storage
    const STORAGE_KEY = 'emsalHesaplamaData';
    let processHistoryData = [];

    // Load data from localStorage on startup
    const loadFromStorage = () => {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          const parsed = JSON.parse(stored);
          processHistoryData = parsed.history || [];
          state.history = [...processHistoryData]; // Sync state.history
          // Restore other state if needed
          if (parsed.mainInfo) state.mainInfo = parsed.mainInfo;
          if (parsed.karmaList) state.karmaList = parsed.karmaList;
          if (parsed.historyTheme) state.historyTheme = parsed.historyTheme;
          return true;
        }
      } catch (e) {
        console.error('LocalStorage yükleme hatası:', e);
        showNotification('Veriler yüklenirken hata oluştu', 'error');
      }
      return false;
    };

    // Save data to localStorage
    const saveToStorage = () => {
      try {
        const dataToSave = {
          history: processHistoryData,
          mainInfo: state.mainInfo,
          karmaList: state.karmaList,
          historyTheme: state.historyTheme,
          timestamp: new Date().toISOString()
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave));
        return true;
      } catch (e) {
        console.error('LocalStorage kaydetme hatası:', e);
        showNotification('Veriler kaydedilirken hata oluştu', 'error');
        return false;
      }
    };

    // Debounced version for auto-save (waits 500ms after last change)
    const debouncedSaveToStorage = debounce(saveToStorage, 500);

    // History functions with localStorage integration
    const saveProcessHistory = data => {
      processHistoryData.push(data);
      saveToStorage();
      return [...processHistoryData];
    };
    const getProcessHistory = () => [...processHistoryData];
    const clearProcessHistory = () => {
      processHistoryData = [];
      saveToStorage();
      return [];
    };
    
    // Form verilerini temizleme fonksiyonu
    const clearFormData = () => {
      // Custom onay kutusu oluştur
      const overlay = createElement('div', {
        className: 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50',
        style: {
          position: 'fixed',
          top: 0,
          left: 0,
          right: 0,
          bottom: 0,
          backgroundColor: 'rgba(0, 0, 0, 0.5)',
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center',
          zIndex: 9999
        },
        onClick: (e) => {
          // Overlay'e tıklanırsa kapat
          if (e.target === overlay) {
            overlay.remove();
          }
        }
      });

      const modal = createElement('div', {
        className: 'bg-white dark:bg-anthracite-700 rounded-lg shadow-2xl p-6 max-w-sm mx-4',
        style: {
          backgroundColor: document.documentElement.classList.contains('dark') ? '#2d3436' : 'white',
          borderRadius: '12px',
          padding: '24px',
          maxWidth: '320px',
          margin: '0 16px',
          boxShadow: '0 20px 25px -5px rgba(0, 0, 0, 0.3)'
        }
      });

      const message = createElement('p', {
        className: 'text-gray-800 dark:text-gray-100 text-center mb-6 text-base',
        style: {
          color: document.documentElement.classList.contains('dark') ? '#f3f4f6' : '#1f2937',
          textAlign: 'center',
          marginBottom: '24px',
          fontSize: '16px'
        }
      }, 'Tüm verileri temizlemek istediğinizden emin misiniz?');

      const okButton = createElement('button', {
        className: 'w-full bg-red-500 hover:bg-red-600 text-white font-medium py-3 px-6 rounded-lg transition-all shadow-md',
        style: {
          width: '100%',
          backgroundColor: '#ef4444',
          color: 'white',
          fontWeight: 500,
          padding: '12px 24px',
          borderRadius: '8px',
          border: 'none',
          cursor: 'pointer',
          transition: 'all 0.2s'
        },
        onClick: () => {
          overlay.remove();
          performClear();
        }
      }, 'OK');

      okButton.addEventListener('mouseenter', () => {
        okButton.style.backgroundColor = '#dc2626';
      });
      okButton.addEventListener('mouseleave', () => {
        okButton.style.backgroundColor = '#ef4444';
      });

      modal.appendChild(message);
      modal.appendChild(okButton);
      overlay.appendChild(modal);
      document.body.appendChild(overlay);

      // ESC tuşu ile kapatma
      const handleEsc = (e) => {
        if (e.key === 'Escape') {
          overlay.remove();
          document.removeEventListener('keydown', handleEsc);
        }
      };
      document.addEventListener('keydown', handleEsc);
    };

    // Asıl temizleme işlemini yapan fonksiyon
    const performClear = () => {
      // Karma verilerini sıfırla
      state.karmaData = { 
        daireSayisi: "", 
        netAlan: "", 
        daireType: "3+1" 
      };
      state.karmaTypeTouched = false;
      state.karmaList = [];
      
      // Sonuçları temizle
      state.result = null;
      state.selectedAltIndexes = [];
      state.finalAlternatives = null;
      state.error = "";
      
      // Kayıtları (history) temizle
      processHistoryData = [];
      state.history = [];
      
      // Yüklenen dosyaları temizle
      state.files = [];
      
      // LocalStorage'ı güncelle
      saveToStorage();
      
      // Arayüzü yenile
      renderApp();
      
      // Bildirim göster
      showNotification('Veriler temizlendi (ana bilgiler korundu)', 'success');
    };

    // Notification system
    let notificationTimeout = null;
    const showNotification = (message, type = 'info') => {
      if (notificationTimeout) {
        clearTimeout(notificationTimeout);
      }
      
      const existingNotification = document.getElementById('notification');
      if (existingNotification) {
        existingNotification.remove();
      }
      
      let bgColor, textColor;
      
      if (type === 'success') {
        bgColor = 'bg-sky-50 dark:bg-sky-900/30';
        textColor = 'text-sky-800 dark:text-sky-200';
      } else if (type === 'error') {
        bgColor = 'bg-red-50 dark:bg-red-900/30';
        textColor = 'text-red-800 dark:text-red-200';
      } else {
        bgColor = 'bg-blue-50 dark:bg-blue-900/30';
        textColor = 'text-blue-800 dark:text-blue-200';
      }
      
      const notification = document.createElement('div');
      notification.id = 'notification';
      notification.className = `fixed bottom-4 right-4 z-50 p-4 rounded-lg shadow-lg border ${bgColor} ${textColor} transition-opacity duration-300`;
      notification.textContent = message;
      notification.style.opacity = '0';
      
      document.body.appendChild(notification);
      
      // Animate in
      setTimeout(() => {
        notification.style.opacity = '1';
      }, 10);
      
      // Auto-hide after 3 seconds
      notificationTimeout = setTimeout(() => {
        notification.style.opacity = '0';
        setTimeout(() => {
          notification.remove();
        }, 300);
      }, 3000);
    };

    // Utility functions
    function createElement(tag, props = {}, children = []) {
      const element = document.createElement(tag);
      const isTextInput = tag.toLowerCase() === 'input' && props.type && props.type.toLowerCase() === 'text';
      const isTextArea = tag.toLowerCase() === 'textarea';
      const isSelect = tag.toLowerCase() === 'select';
      
      let valueProp = null; // Store value prop separately for inputs/textareas
      
      // Apply attributes and event listeners
      Object.entries(props).forEach(([key, value]) => {
        if (key.startsWith('on') && typeof value === 'function') {
          const eventName = key.slice(2).toLowerCase();
          element.addEventListener(eventName, value);
        } else if (key === 'className') {
          element.className = value;
        } else if (key === 'disabled') {
          if (value) element.setAttribute('disabled', '');
        } else if (key === 'innerHTML') {
          element.innerHTML = value;
        } else if (key === 'checked') {
          element.checked = !!value; // Set property directly
        } else if (key === 'selected' && isSelect) {
          // 'selected' for option elements is handled later or should be managed by parent select value
        } else if (key === 'value' && (isTextInput || isTextArea || isSelect)) {
          // Store value to set it directly later for input/textarea/select
          valueProp = value;
        } else if (key === 'style' && typeof value === 'object') {
          Object.assign(element.style, value);
        } else if (key !== 'selected') { // Avoid setting selected as attribute for options
          element.setAttribute(key, value);
        }
      });
      
      // Append children (important for select options)
      if (Array.isArray(children)) {
        children.forEach(child => {
          if (child !== null && child !== undefined) {
            if (typeof child === 'string' || typeof child === 'number') {
              element.appendChild(document.createTextNode(child.toString()));
            } else {
              element.appendChild(child);
            }
          }
        });
      } else if (children !== null && children !== undefined) {
        if (typeof children === 'string' || typeof children === 'number') {
          element.appendChild(document.createTextNode(children.toString()));
        } else {
          element.appendChild(children);
        }
      }
      
      // Set value property directly *after* children are appended (especially for select)
      if (valueProp !== null && (isTextInput || isTextArea || isSelect)) {
        element.value = valueProp;
      }
      
      return element;
    }

    // App state
    const state = {
      activeTab: 'form',
      mainInfo: { arsaAlani: "", kaks: "", katSayisi: "1", carpanSayisi: "0" },
      karmaData: { daireSayisi: "", netAlan: "", daireType: "3+1" },
      karmaTypeTouched: false,
      karmaList: [],
      result: null,
      selectedAltIndexes: [],
      finalAlternatives: null,
      kat: 1,
      error: "",
      history: getProcessHistory(),
      files: [],
      isDarkMode: document.documentElement.classList.contains('dark'),
      hiddenCols: {
        alternative: false,
        daireTipi: false,
        toplamDaire: false,
        katBasina: true,
        net: true,
        brut: false
      },
      zoom: 100,
      showZoomControls: false,
      editingHistoryIndex: -1,
      containerDimensions: {
        width: '100%',
        height: '600px'
      },
      historyTheme: 'blue' // blue, green, purple, orange, red
    };

    // Main app components
    function renderApp() {
      const appContainer = document.getElementById('app');
      appContainer.innerHTML = '';
      
      // Add global styles
      const styles = createElement('style', {}, `
        .image-container {
          min-width: 300px;
          min-height: 200px;
          max-width: 100%;
          max-height: 800px;
          position: relative;
          cursor: grab;
          background: #f5f5f5;
          border-radius: 8px;
        }
        .dark .image-container {
          background: #1f2937;
        }
        .image-container:active {
          cursor: grabbing;
        }
        .zoom-controls {
          position: fixed;
          bottom: 20px;
          right: 20px;
          background: rgba(255, 255, 255, 0.95);
          padding: 8px 16px;
          border-radius: 20px;
          box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
          display: flex;
          align-items: center;
          gap: 12px;
          z-index: 1000;
          opacity: 0;
          transform: translateY(10px);
          transition: opacity 0.3s ease, transform 0.3s ease;
          user-select: none;
        }
        .dark .zoom-controls {
          background: rgba(30, 41, 59, 0.95);
          color: #f3f4f6;
        }
        .zoom-controls.visible {
          opacity: 1;
          transform: translateY(0);
        }
        .zoom-reset {
          padding: 4px 12px;
          background: #f3f4f6;
          border: 1px solid #e5e7eb;
          border-radius: 16px;
          cursor: pointer;
          font-size: 14px;
          transition: all 0.2s ease;
        }
        .dark .zoom-reset {
          background: #374151;
          border-color: #4b5563;
          color: #f3f4f6;
        }
        .zoom-reset:hover {
          background: #e5e7eb;
          transform: scale(1.05);
        }
        .split-pane-container {
          display: flex;
          width: 100%;
          height: 600px;
          position: relative;
          border: 2px solid #e5e7eb;
          border-radius: 8px;
          overflow: hidden;
          background-color: white;
        }
        .dark .split-pane-container {
          border-color: #4b5563;
          background-color: #1f2937;
        }
        .split-pane-item {
          height: 100%;
          overflow: hidden;
          display: flex;
          flex-direction: column;
          transition: width 0.15s ease;
        }
        .split-pane-divider {
          width: 8px;
          height: 100%;
          background-color: #f3f4f6;
          position: absolute;
          top: 0;
          cursor: col-resize;
          display: flex;
          justify-content: center;
          align-items: center;
          z-index: 10;
          transition: background-color 0.2s;
        }
        .dark .split-pane-divider {
          background-color: #374151;
        }
        .split-pane-divider:hover {
          background-color: #e5e7eb;
        }
        .dark .split-pane-divider:hover {
          background-color: #4b5563;
        }
        .split-pane-divider::after {
          content: '';
          width: 4px;
          height: 36px;
          background-color: #9ca3af;
          border-radius: 2px;
        }
        .dark .split-pane-divider::after {
          background-color: #6b7280;
        }
        
        /* Resize handle styles */
        .resize-handle {
          position: absolute;
          bottom: 0;
          right: 0;
          width: 20px;
          height: 20px;
          cursor: nwse-resize;
          z-index: 20;
        }
        
        .resize-handle::before {
          content: "";
          position: absolute;
          right: 3px;
          bottom: 3px;
          width: 12px;
          height: 12px;
          border-right: 3px solid #9ca3af;
          border-bottom: 3px solid #9ca3af;
          border-bottom-right-radius: 2px;
        }
        
        .dark .resize-handle::before {
          border-color: #6b7280;
        }
        
        @keyframes clickEffect {
          0% { background-color: #9333ea; }
          100% { background-color: #7e22ce; }
        }
        .save-button {
          transition: background-color 0.2s;
        }
        .save-button.animating {
          animation: clickEffect 0.2s ease;
        }
        
        /* Dark mode text visibility fixes */
        .dark h1, .dark h2, .dark h3, .dark h4, .dark h5, .dark h6 {
          color: #f3f4f6;
        }
        .dark .text-gray-800 {
          color: #f3f4f6;
        }
        .dark .text-gray-700 {
          color: #e5e7eb;
        }
        .dark .text-gray-600 {
          color: #d1d5db;
        }

        /* Mobile optimizations */
        @media (max-width: 640px) {
          input[type="text"],
          input[type="number"],
          select,
          textarea,
          button {
            min-height: 44px; /* Touch target size */
          }

          /* Prevent zoom on input focus on iOS */
          input[type="text"],
          input[type="number"],
          select,
          textarea {
            font-size: 16px !important;
          }
        }
      `);
      appContainer.appendChild(styles);
      
      // Header with title and theme toggle
      const header = createElement('header', {
        className: 'mb-4 md:mb-6 flex items-center justify-between bg-gradient-to-br from-slate-700 via-slate-600 to-slate-500 dark:from-slate-800 dark:via-slate-700 dark:to-slate-600 p-3 md:p-6 rounded-xl shadow-2xl border border-slate-400/20'
      }, [
        createElement('h1', {
          className: 'text-xl md:text-3xl font-bold flex-1 text-center text-white drop-shadow-lg tracking-wide'
        }, 'Emsal Hesaplama (Byres)'),

        createElement('button', {
          className: 'p-2 rounded-lg bg-white/20 hover:bg-white/30 text-white backdrop-blur-sm transition-all flex-shrink-0',
          title: state.isDarkMode ? 'Açık Moda Geç' : 'Koyu Moda Geç',
          onClick: toggleDarkMode
        }, [
          createElement('svg', {
            className: 'w-5 h-5 md:w-6 md:h-6',
            fill: 'none',
            viewBox: '0 0 24 24',
            stroke: 'currentColor',
            innerHTML: state.isDarkMode
              ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>'
              : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>'
          })
        ])
      ]);
      appContainer.appendChild(header);
      
      // Error message
      if (state.error) {
        const alertElement = createElement('div', {
          className: 'border-l-4 p-4 mb-4 bg-red-50 border-red-200 text-red-700 dark:bg-red-900/30 dark:border-red-800 dark:text-red-400'
        }, state.error);
        appContainer.appendChild(alertElement);
      }
      
      // Tab navigation
      const tabContainer = createElement('div', {
        className: 'mb-4 flex gap-1 md:gap-2 justify-center'
      }, [
        createElement('button', {
          className: 'px-3 md:px-6 py-2 md:py-3 text-sm md:text-base font-medium rounded-t-lg transition-all bg-red-500 dark:bg-red-600 text-white hover:bg-red-600 dark:hover:bg-red-700',
          onClick: clearFormData
        }, 'Temizle'),

        createElement('button', {
          className: `px-3 md:px-6 py-2 md:py-3 text-sm md:text-base font-medium rounded-t-lg transition-all ${
            state.activeTab === 'form'
              ? "bg-white dark:bg-anthracite-700 text-primary-600 dark:text-primary-400 border-t-4 border-primary-600 shadow-md"
              : "bg-anthracite-100 dark:bg-anthracite-600 text-anthracite-700 dark:text-gray-300 hover:bg-anthracite-200 dark:hover:bg-anthracite-500"
          }`,
          onClick: () => {
            state.activeTab = 'form';
            renderApp();
          }
        }, 'Form'),

        createElement('button', {
          className: `px-3 md:px-6 py-2 md:py-3 text-sm md:text-base font-medium rounded-t-lg transition-all ${
            state.activeTab === 'results'
              ? "bg-white dark:bg-anthracite-700 text-success-600 dark:text-success-400 border-t-4 border-success-600 shadow-md"
              : "bg-anthracite-100 dark:bg-anthracite-600 text-anthracite-700 dark:text-gray-300 hover:bg-anthracite-200 dark:hover:bg-anthracite-500"
          }`,
          onClick: () => {
            state.activeTab = 'results';
            renderApp();
          }
        }, 'Sonuçlar'),

        createElement('button', {
          className: `px-3 md:px-6 py-2 md:py-3 text-sm md:text-base font-medium rounded-t-lg transition-all ${
            state.activeTab === 'history'
              ? "bg-white dark:bg-anthracite-700 text-anthracite-700 dark:text-anthracite-200 border-t-4 border-anthracite-600 shadow-md"
              : "bg-anthracite-100 dark:bg-anthracite-600 text-anthracite-700 dark:text-gray-300 hover:bg-anthracite-200 dark:hover:bg-anthracite-500"
          }`,
          onClick: () => {
            state.activeTab = 'history';
            renderApp();
          }
        }, 'Kayıtlar')
      ]);
      appContainer.appendChild(tabContainer);
      
      // Tab content
      let tabContent;
      switch (state.activeTab) {
        case 'form':
          tabContent = renderFormTab();
          break;
        case 'results':
          tabContent = renderResultsTab();
          break;
        case 'history':
          tabContent = renderHistoryTab();
          break;
      }
      
      appContainer.appendChild(tabContent);
    }
    
    function createCard(title, children, className = '') {
      const card = createElement('div', {
        className: `bg-white dark:bg-anthracite-700 rounded-lg shadow-lg border border-gray-200 dark:border-anthracite-600 p-3 md:p-4 mb-3 md:mb-4 ${className}`
      });

      if (title) {
        const titleElement = createElement('h2', {
          className: 'text-xl md:text-2xl font-bold mb-2 md:mb-3 text-anthracite-800 dark:text-white'
        }, title);
        card.appendChild(titleElement);
      }
      
      if (Array.isArray(children)) {
        children.forEach(child => {
          if (child) card.appendChild(child);
        });
      } else if (children) {
        card.appendChild(children);
      }
      
      return card;
    }
    
    function createLabel(text) {
      return createElement('label', {
        className: 'block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300'
      }, text);

      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        state.isDarkMode = false;
      } else {
        document.documentElement.classList.add('dark');
        state.isDarkMode = true;
      }
      renderApp();

    // Setup handlers for resizing the split pane
    function setupResizeHandlers(splitContainer, leftPanel, rightPanel, divider, resizeHandle) {
      let isDragging = false;
      let isResizing = false;
      let initialWidth, initialHeight, initialX, initialY;
      
      divider.addEventListener('mousedown', (e) => {
        e.preventDefault();
        isDragging = true;
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
      });
      
      resizeHandle.addEventListener('mousedown', (e) => {
        e.preventDefault();
        isResizing = true;
        initialWidth = splitContainer.offsetWidth;
        initialHeight = splitContainer.offsetHeight;
        initialX = e.clientX;
        initialY = e.clientY;
        document.body.style.cursor = 'nwse-resize';
        document.body.style.userSelect = 'none';
      });
      
      document.addEventListener('mousemove', (e) => {
        if (isDragging) {
          const containerRect = splitContainer.getBoundingClientRect();
          const containerWidth = containerRect.width;
          const offsetX = e.clientX - containerRect.left;
          
          // Calculate percentage (constrained between 20% and 80%)
          let position = Math.min(Math.max((offsetX / containerWidth) * 100, 20), 80);
          
          // Update panel widths
          leftPanel.style.width = `${position}%`;
          rightPanel.style.width = `${100 - position}%`;
          divider.style.left = `${position}%`;
        }
        
        if (isResizing) {
          // Calculate new dimensions
          const deltaX = e.clientX - initialX;
          const deltaY = e.clientY - initialY;
          
          // Constrain minimum size
          const newWidth = Math.max(initialWidth + deltaX, 600);
          const newHeight = Math.max(initialHeight + deltaY, 400);
          
          // Apply new dimensions
          splitContainer.style.width = `${newWidth}px`;
          splitContainer.style.height = `${newHeight}px`;
          
          // Save dimensions to state
          state.containerDimensions.width = `${newWidth}px`;
          state.containerDimensions.height = `${newHeight}px`;
        }
      });
      
      document.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
        }
        
        if (isResizing) {
          isResizing = false;
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
        }
      });
    }
    
    // Action functions
    function addKarma() {
      if (!state.karmaData.netAlan || (state.karmaData.daireType !== "TİCARİ" && !state.karmaData.daireSayisi)) {

        renderApp();

      const entry = {

        brutAlan: calculateBrut(parseFloat(state.karmaData.netAlan)),
        netAlanTotal: parseFloat(state.karmaData.netAlan) * (state.karmaData.daireType === "TİCARİ" ? 1 : parseFloat(state.karmaData.daireSayisi))
      };

      state.karmaList = [...state.karmaList, entry];
      state.karmaData = { daireSayisi: "", netAlan: "", daireType: "3+1" };
      state.karmaTypeTouched = false;
      state.error = "";

      saveToStorage(); // Auto-save
      showNotification('Karma alan eklendi', 'success');

    function calculate() {
      // Enhanced validation
      const arsaAlani = parseFloat(state.mainInfo.arsaAlani);
      const kaks = parseFloat(state.mainInfo.kaks);
      const katSayisi = parseInt(state.mainInfo.katSayisi, 10);

      // Check if fields are filled
      if (!state.mainInfo.arsaAlani || !state.mainInfo.kaks || !state.mainInfo.katSayisi) {
        state.error = "Lütfen tüm alanları doldurun";
        renderApp();
        showNotification('Lütfen tüm zorunlu alanları doldurun', 'error');
        return;
      }

      // Validate numeric values
      if (isNaN(arsaAlani) || arsaAlani <= 0) {
        state.error = "Arsa alanı geçerli bir pozitif sayı olmalıdır";
        renderApp();
        showNotification('Geçersiz arsa alanı', 'error');
        return;
      }

      if (isNaN(kaks) || kaks <= 0) {
        state.error = "KAKS geçerli bir pozitif sayı olmalıdır";
        renderApp();
        showNotification('Geçersiz KAKS değeri', 'error');
        return;
      }

      if (isNaN(katSayisi) || katSayisi < 1) {
        state.error = "Kat sayısı en az 1 olmalıdır";
        renderApp();
        showNotification('Geçersiz kat sayısı', 'error');
        return;
      }

      // Reasonable limits check
      if (arsaAlani > 1000000) {
        state.error = "Arsa alanı çok büyük görünüyor (max 1.000.000 m²)";
        renderApp();
        showNotification('Arsa alanı çok büyük', 'error');
        return;
      }

      if (kaks > 10) {
        state.error = "KAKS değeri çok yüksek görünüyor (max 10)";
        renderApp();
        showNotification('KAKS değeri çok yüksek', 'error');
        return;
      }

      if (katSayisi > 100) {
        state.error = "Kat sayısı çok yüksek görünüyor (max 100)";
        renderApp();
        showNotification('Kat sayısı çok yüksek', 'error');
        return;
      }

      state.error = "";
      state.selectedAltIndexes = [];
      state.finalAlternatives = null;

      try {
        const ekl = kaks * C.SC;
        const he = kaks + ekl * parseInt(state.mainInfo.carpanSayisi, 10);
        const tot = arsaAlani * he;
        const km = state.karmaList.reduce((sum, o) => sum + o.netAlanTotal, 0);
        const rem = tot - km;
        const kt = katSayisi;
        state.kat = kt;

        if (rem < 0) {
          state.error = "Karma alan toplamı, toplam inşaat alanını aşıyor";
          renderApp();
          showNotification('Karma alan fazla', 'error');
          return;
        }

        state.result = {
          totalArea: tot,
          remainingNetArea: rem,
          remainingBrutArea: rem * 1.18,
          usedEmsal: he,
          floorArea: tot / kt,
          alternatives: calcAlternatives(rem, kt)
        };

        state.activeTab = 'results';
        renderApp();
        showNotification('Hesaplama tamamlandı', 'success');
      } catch (e) {
        console.error('Hesaplama hatası:', e);
        state.error = "Hesaplama hatası: " + e.message;
        renderApp();
        showNotification('Hesaplama sırasında hata oluştu', 'error');
      }
    }
    
    function calcAlternatives(rem, kat) {
      try {
        const alts = [];
        const maxUnits = Math.floor(rem / C.MIN);

        if (maxUnits < 1 || kat < 1) {
          console.warn('Geçersiz değerler: maxUnits:', maxUnits, 'kat:', kat);
          return [];
        }

        for (let t = kat; t <= maxUnits; t += kat) {
          const net = rem / t;
          if (net >= C.MIN)
            alts.push({
              totalUnits: t,
              unitsPerFloor: t / kat,
              netArea: net.toFixed(2),
              brutArea: calculateBrut(net),
              type: getType(net)
            });
        }

        return alts;
      } catch (e) {
        console.error('Alternatif hesaplama hatası:', e);
        return [];
      }
    }

    // Import data from JSON
    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const importedData = JSON.parse(e.target.result);

          // Validate imported data structure
          if (!importedData.version) {
            throw new Error('Geçersiz dosya formatı');
          }

          // Restore data
          if (importedData.history) {
            processHistoryData = importedData.history;
            state.history = importedData.history;
          }
          if (importedData.mainInfo) {
            state.mainInfo = importedData.mainInfo;
          }
          if (importedData.karmaList) {
            state.karmaList = importedData.karmaList;
          }

          saveToStorage(); // Save imported data
          renderApp();
          showNotification('Veriler başarıyla içe aktarıldı', 'success');
        } catch (error) {
          console.error('Import hatası:', error);
          showNotification('İçe aktarma hatası: ' + error.message, 'error');
        }
      };

      reader.onerror = () => {
        showNotification('Dosya okuma hatası', 'error');
      };

      reader.readAsText(file);
    }

    // History editing functions
    let editBackup = null;
    
    function startEditingHistory(index) {

      editBackup = JSON.parse(JSON.stringify(state.history[index]));
      
      // Düzenleme moduna geç
      state.editingHistoryIndex = index;

    function cancelHistoryEdit() {

      if (editBackup && state.editingHistoryIndex >= 0) {
        state.history[state.editingHistoryIndex] = editBackup;
      }
      
      // Düzenleme modundan çık
      state.editingHistoryIndex = -1;

    function saveHistoryEdit(index) {
      // Get title input, content textarea, and image input
      const titleInput = document.getElementById(`edit-title-${index}`);
      const contentTextarea = document.getElementById(`edit-content-${index}`);
      const imageInput = document.getElementById(`edit-image-${index}`);

      if (!titleInput || !contentTextarea) {
        console.error('Edit inputs not found for index:', index);
        cancelHistoryEdit();
        return;
      }

      const updatedEntry = { ...state.history[index] };

      // Update title
      const titleValue = titleInput.value.trim();
      updatedEntry.title = titleValue || `Alternatif ${index + 1}`;

      // Update content (split by newlines) - Save as plain text
      const contentValue = contentTextarea.value;
      const contentLines = contentValue.split('\n').filter(line => line !== null && line !== undefined);

      // Escape HTML to prevent XSS and save as plain text
      const escapedLines = contentLines.map(line => {
        return line
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      });

      updatedEntry.data = escapedLines.length > 0 ? escapedLines : [''];

      // Check if image was uploaded
      if (imageInput && imageInput.files && imageInput.files[0]) {
        const file = imageInput.files[0];
        const reader = new FileReader();

        reader.onload = (e) => {
          updatedEntry.image = e.target.result;

          // Update the history
          state.history[index] = updatedEntry;
          processHistoryData[index] = updatedEntry;
          editBackup = null;

          // Exit edit mode
          state.editingHistoryIndex = -1;

          saveToStorage(); // Save changes
          renderApp();
          showNotification('Kayıt ve görsel güncellendi', 'success');
        };

        reader.readAsDataURL(file);
      } else {
        // No new image, just save text changes
        // Update the history
        state.history[index] = updatedEntry;
        processHistoryData[index] = updatedEntry;
        editBackup = null;

        // Exit edit mode
        state.editingHistoryIndex = -1;

        saveToStorage(); // Save changes
        renderApp();
        showNotification('Kayıt güncellendi', 'success');
      }
    }
    
    // Zoom controls
    function handleZoomWheel(e) {
      if (e.ctrlKey) {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 10 : -10;
        const newZoom = Math.max(50, Math.min(300, state.zoom + delta));
        
        if (newZoom !== state.zoom) {
          state.zoom = newZoom;
          updateZoomUI(e.currentTarget);
        }
      }
    }
    
    // Update zoom UI without full re-render
    function updateZoomUI(container) {
      // Find content element to transform
      let contentElement;
      if (container.querySelector('.image-content')) {
        contentElement = container.querySelector('.image-content');
      } else {
        // For PDF, the first child of the container is usually the content div
        contentElement = container.firstElementChild;
      }
      
      if (contentElement) {
        // Update transform scale
        contentElement.style.transform = `scale(${state.zoom / 100})`;
        
        // Update dimensions for zoom levels > 100%
        if (state.zoom > 100) {
          contentElement.style.width = `${state.zoom}%`;
          contentElement.style.height = `${state.zoom}%`;
        } else {
          contentElement.style.width = '100%';
          contentElement.style.height = '100%';
        }
      }
      
      // Show zoom controls
      showZoomControlsTemporarily();
    }
    
    // Show zoom controls temporarily
    function showZoomControlsTemporarily() {
      const zoomControlsElements = document.querySelectorAll('.zoom-controls');
      zoomControlsElements.forEach(element => {
        // Update zoom percentage text
        const percentText = element.querySelector('span');
        if (percentText) {
          percentText.textContent = Math.round(state.zoom) + '%';
        }
        
        // Show controls
        element.classList.add('visible');
        
        // Hide after delay
        clearTimeout(state.zoomControlsTimeout);
        state.zoomControlsTimeout = setTimeout(() => {
          element.classList.remove('visible');
        }, 1500);
      });
    }
    
    // Reset zoom level
    function resetZoom() {
      state.zoom = 100;
      
      // Find all zoomable content and reset
      document.querySelectorAll('.image-content, .flex-1.w-full.overflow-auto > div').forEach(contentElement => {
        contentElement.style.transform = 'scale(1)';
        contentElement.style.width = '100%';
        contentElement.style.height = '100%';
      });
      
      showZoomControlsTemporarily();
    }
    
    // Setup draggable container
    function setupDraggable(container) {
      let isDragging = false;
      let startX = 0;
      let startY = 0;
      let scrollLeft = 0;
      let scrollTop = 0;

      // Touch gesture variables
      let initialDistance = 0;
      let initialZoom = 100;

      container.style.cursor = 'grab';

      // Mouse events
      container.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.pageX - container.offsetLeft;
        startY = e.pageY - container.offsetTop;
        scrollLeft = container.scrollLeft;
        scrollTop = container.scrollTop;
        container.style.cursor = 'grabbing';
      });

      container.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        e.preventDefault();
        const x = e.pageX - container.offsetLeft;
        const y = e.pageY - container.offsetTop;
        const walkX = (x - startX) * 1.5;
        const walkY = (y - startY) * 1.5;
        container.scrollLeft = scrollLeft - walkX;
        container.scrollTop = scrollTop - walkY;
      });

      const stopDragging = () => {
        isDragging = false;
        container.style.cursor = 'grab';
      };

      container.addEventListener('mouseup', stopDragging);
      container.addEventListener('mouseleave', stopDragging);

      // Touch events for mobile
      container.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          // Single touch - drag
          isDragging = true;
          const touch = e.touches[0];
          startX = touch.pageX - container.offsetLeft;
          startY = touch.pageY - container.offsetTop;
          scrollLeft = container.scrollLeft;
          scrollTop = container.scrollTop;
        } else if (e.touches.length === 2) {
          // Two fingers - prepare for pinch zoom
          isDragging = false;
          const touch1 = e.touches[0];
          const touch2 = e.touches[1];
          initialDistance = Math.hypot(
            touch2.pageX - touch1.pageX,
            touch2.pageY - touch1.pageY
          );
          initialZoom = state.zoom;
        }
      });

      container.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && isDragging) {
          // Single touch drag
          e.preventDefault();
          const touch = e.touches[0];
          const x = touch.pageX - container.offsetLeft;
          const y = touch.pageY - container.offsetTop;
          const walkX = (x - startX) * 1.5;
          const walkY = (y - startY) * 1.5;
          container.scrollLeft = scrollLeft - walkX;
          container.scrollTop = scrollTop - walkY;
        } else if (e.touches.length === 2) {
          // Pinch zoom
          e.preventDefault();
          const touch1 = e.touches[0];
          const touch2 = e.touches[1];
          const currentDistance = Math.hypot(
            touch2.pageX - touch1.pageX,
            touch2.pageY - touch1.pageY
          );

          // Calculate zoom based on pinch distance
          const scale = currentDistance / initialDistance;
          const newZoom = Math.min(Math.max(initialZoom * scale, 50), 300);

          state.zoom = newZoom;
          state.showZoomControls = true;
          renderApp();
        }
      });

      container.addEventListener('touchend', (e) => {
        if (e.touches.length === 0) {
          isDragging = false;
          initialDistance = 0;
        }
      });

      // Add zoom wheel event
      container.addEventListener('wheel', handleZoomWheel);

      return container;
    }
    
    // Create zoom controls
    function createZoomControls() {
      const zoomControls = createElement('div', {
        className: `zoom-controls ${state.showZoomControls ? 'visible' : ''}`
      });
      
      zoomControls.appendChild(createElement('span', {}, Math.round(state.zoom) + '%'));
      zoomControls.appendChild(createElement('button', {
        className: 'zoom-reset',
        onClick: resetZoom
      }, 'Sıfırla'));
      
      return zoomControls;
    }
    
    // Initialize the app
    loadFromStorage(); // Load saved data on startup
    renderApp();
    
    // Add document-level paste event listener for Ctrl+V functionality
    document.addEventListener('paste', function(e) {
      // Only handle paste if we're on the form tab
      if (state.activeTab !== 'form') return;
      
      e.preventDefault();
      e.stopPropagation();
      
      if (e.clipboardData && e.clipboardData.items) {
        const items = e.clipboardData.items;
        
        for (let i = 0; i < items.length; i++) {
          if (items[i].type.indexOf('image') !== -1) {
            const file = items[i].getAsFile();
            if (file) {
              state.files = [file]; // Replace any existing files
              showNotification('Görsel yapıştırıldı', 'success');
              renderApp();
              break;
            }
          } else if (items[i].type === 'application/pdf') {
            const file = items[i].getAsFile();
            if (file) {
              state.files = [file]; // Replace any existing files
              showNotification('PDF yapıştırıldı', 'success');
              renderApp();
              break;
            }
          }
        }
      }
    });
  </script>
</body>
</html>
