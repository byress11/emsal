  <script>
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.classList.add('dark');
    }
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
      document.documentElement.classList[event.matches ? 'add' : 'remove']('dark');
    });

    // ─── CONSTANTS ───
    const C = { SC: 0.1, MIN: 30, OPT: ["1+1", "2+0", "2+1", "3+1", "4+1", "TİCARİ"] };
    const roundToFive = num => Math.ceil(num / 5) * 5;
    const calculateBrut = net => roundToFive(net * 1.18 + 12);
    const getType = net =>
      net >= C.MIN
        ? net < 50 ? "1+1" : net < 78 ? "2+0" : net < 98 ? "2+1" : net < 150 ? "3+1" : "4+1"
        : "Geçersiz";

    function debounce(func, wait) {
      let timeout;
      return function (...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func(...args), wait);
      };
    }

    const formatAlternative = (alt, i, k, arr) => {
      let s = `Alternatif ${i + 1}: (${k} kat) -- ${alt.brutArea} m² den ${alt.type}, ${alt.totalUnits} daire`;
      if (arr?.length)
        s += " " + arr
          .map(o =>
            o.daireType === "TİCARİ"
              ? `ve ${o.netAlan} m² ticari net alan çıkar`
              : `ve ${o.brutAlan} m² den ${o.daireType}, ${o.daireSayisi} daire çıkar`
          ).join(" ");
      s = s.trim();
      if (!s.endsWith('çıkar')) s += ' çıkar';
      return s;
    };

    // ─── LOCAL STORAGE ───
    const STORAGE_KEY = 'emsalHesaplamaData';
    const STORAGE_MAX_HISTORY_ITEMS = 120;
    const STORAGE_MAX_IMAGE_BYTES = 250 * 1024;
    let processHistoryData = [];

    const estimateDataUrlBytes = (dataUrl = '') => {
      if (typeof dataUrl !== 'string') return 0;
      const commaIndex = dataUrl.indexOf(',');
      const base64Part = commaIndex >= 0 ? dataUrl.slice(commaIndex + 1) : dataUrl;
      return Math.ceil((base64Part.length * 3) / 4);
    };

    const compactHistoryForStorage = (history = []) => {
      return history.slice(-STORAGE_MAX_HISTORY_ITEMS).map(entry => {
        if (!entry || typeof entry !== 'object') return entry;
        const c = { ...entry };
        if (typeof c.image === 'string' && c.image.startsWith('data:') && estimateDataUrlBytes(c.image) > STORAGE_MAX_IMAGE_BYTES) {
          delete c.image;
          c.imageOmitted = true;
        }
        return c;
      });
    };

    const isQuotaExceededError = error =>
      error && (error.name === 'QuotaExceededError' || error.name === 'NS_ERROR_DOM_QUOTA_REACHED' || error.code === 22 || error.code === 1014);

    const loadFromStorage = () => {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          const parsed = JSON.parse(stored);
          processHistoryData = parsed.history || [];
          state.history = [...processHistoryData];
          if (parsed.mainInfo) state.mainInfo = parsed.mainInfo;
          if (parsed.karmaList) state.karmaList = parsed.karmaList;
          if (parsed.historyTheme) state.historyTheme = parsed.historyTheme;
          return true;
        }
      } catch (e) {
        console.error('LocalStorage yükleme hatası:', e);
        showNotification('Veriler yüklenirken hata oluştu', 'error');
      }
      return false;
    };

    const saveToStorage = () => {
      const buildPayload = history => ({
        history, mainInfo: state.mainInfo, karmaList: state.karmaList,
        historyTheme: state.historyTheme, timestamp: new Date().toISOString()
      });
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(buildPayload(processHistoryData)));
        return true;
      } catch (e) {
        if (isQuotaExceededError(e)) {
          try {
            const compacted = compactHistoryForStorage(processHistoryData);
            processHistoryData = compacted;
            state.history = [...compacted];
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...buildPayload(compacted), storageCompacted: true }));
            showNotification('Depolama optimize edildi', 'info');
            return true;
          } catch (_) { /* ignore */ }
        }
        console.error('LocalStorage kaydetme hatası:', e);
        showNotification('Veriler kaydedilirken hata oluştu', 'error');
        return false;
      }
    };

    const debouncedSaveToStorage = debounce(saveToStorage, 500);

    const saveProcessHistory = data => { processHistoryData.push(data); saveToStorage(); return [...processHistoryData]; };
    const getProcessHistory = () => [...processHistoryData];
    const clearProcessHistory = () => { processHistoryData = []; saveToStorage(); return []; };

    // ─── NOTIFICATION SYSTEM ───
    let notificationTimeout = null;
    const showNotification = (message, type = 'info') => {
      if (notificationTimeout) clearTimeout(notificationTimeout);
      const existing = document.getElementById('notification');
      if (existing) existing.remove();

      const colors = {
        success: 'bg-emerald-500 text-white',
        error: 'bg-red-500 text-white',
        info: 'bg-brand-600 text-white'
      };

      const isMob = window.innerWidth < 768;
      const notification = document.createElement('div');
      notification.id = 'notification';
      notification.className = `fixed z-50 rounded-lg shadow-elevated ${colors[type] || colors.info} font-medium transition-all duration-300 ease-out ${isMob ? 'bottom-16 left-3 right-3 px-4 py-2.5 text-xs text-center' : 'bottom-6 right-6 px-5 py-3 text-sm'}`;
      notification.style.opacity = '0';
      notification.style.transform = 'translateY(12px)';
      notification.textContent = message;
      document.body.appendChild(notification);

      requestAnimationFrame(() => {
        notification.style.opacity = '1';
        notification.style.transform = 'translateY(0)';
      });

      notificationTimeout = setTimeout(() => {
        notification.style.opacity = '0';
        notification.style.transform = 'translateY(12px)';
        setTimeout(() => notification.remove(), 300);
      }, 3000);
    };

    // ─── UTILITY ───
    function createElement(tag, props = {}, children = []) {
      const el = document.createElement(tag);
      const isTextInput = tag === 'input' && props.type === 'text';
      const isNumberInput = tag === 'input' && props.type === 'number';
      const isTextArea = tag === 'textarea';
      const isSelect = tag === 'select';
      let valueProp = null;

      Object.entries(props).forEach(([key, value]) => {
        if (key.startsWith('on') && typeof value === 'function') {
          el.addEventListener(key.slice(2).toLowerCase(), value);
        } else if (key === 'className') {
          el.className = value;
        } else if (key === 'disabled') {
          if (value) el.setAttribute('disabled', '');
        } else if (key === 'innerHTML') {
          el.innerHTML = value;
        } else if (key === 'checked') {
          el.checked = !!value;
        } else if (key === 'value' && (isTextInput || isNumberInput || isTextArea || isSelect)) {
          valueProp = value;
        } else if (key === 'style' && typeof value === 'object') {
          Object.assign(el.style, value);
        } else if (key !== 'selected') {
          el.setAttribute(key, value);
        }
      });

      if (Array.isArray(children)) {
        children.forEach(child => {

    // ─── ACTION FUNCTIONS ───
    function addKarma() {
      if (!state.karmaData.netAlan || (state.karmaData.daireType !== "TİCARİ" && !state.karmaData.daireSayisi)) {
        state.error = "Lütfen gerekli alanları doldurun";
        renderApp(); return;
      }
      const entry = {
        ...state.karmaData,
        daireSayisi: state.karmaData.daireType === "TİCARİ" ? "1" : state.karmaData.daireSayisi,
        brutAlan: calculateBrut(parseFloat(state.karmaData.netAlan)),
        netAlanTotal: parseFloat(state.karmaData.netAlan) * (state.karmaData.daireType === "TİCARİ" ? 1 : parseFloat(state.karmaData.daireSayisi))
      };
      state.karmaList = [...state.karmaList, entry];
      state.karmaData = { daireSayisi: "", netAlan: "", daireType: "3+1" };
      state.karmaTypeTouched = false;
      state.error = "";
      saveToStorage();
      showNotification('Karma alan eklendi', 'success');
      renderApp();
    }

    function calculate() {
      const arsaAlani = parseFloat(state.mainInfo.arsaAlani);
      const kaks = parseFloat(state.mainInfo.kaks);
      const katSayisi = parseInt(state.mainInfo.katSayisi, 10);

      if (!state.mainInfo.arsaAlani || !state.mainInfo.kaks || !state.mainInfo.katSayisi) {
        state.error = "Lütfen tüm alanları doldurun"; renderApp(); showNotification('Tüm zorunlu alanları doldurun', 'error'); return;
      }
      if (isNaN(arsaAlani) || arsaAlani <= 0) { state.error = "Arsa alanı geçerli bir pozitif sayı olmalıdır"; renderApp(); return; }
      if (isNaN(kaks) || kaks <= 0) { state.error = "KAKS geçerli bir pozitif sayı olmalıdır"; renderApp(); return; }
      if (isNaN(katSayisi) || katSayisi < 1) { state.error = "Kat sayısı en az 1 olmalıdır"; renderApp(); return; }
      if (arsaAlani > 1000000) { state.error = "Arsa alanı çok büyük (max 1.000.000 m²)"; renderApp(); return; }
      if (kaks > 10) { state.error = "KAKS değeri çok yüksek (max 10)"; renderApp(); return; }
      if (katSayisi > 100) { state.error = "Kat sayısı çok yüksek (max 100)"; renderApp(); return; }

      state.error = "";
      state.selectedAltIndexes = [];
      state.finalAlternatives = null;

      try {
        const ekl = kaks * C.SC;
        const he = kaks + ekl * parseInt(state.mainInfo.carpanSayisi, 10);
        const tot = arsaAlani * he;
        const km = state.karmaList.reduce((sum, o) => sum + o.netAlanTotal, 0);
        const rem = tot - km;
        const kt = katSayisi;
        state.kat = kt;

        if (rem < 0) { state.error = "Karma alan toplamı, toplam inşaat alanını aşıyor"; renderApp(); return; }

        state.result = {
          totalArea: tot, remainingNetArea: rem, remainingBrutArea: rem * 1.18,
          usedEmsal: he, floorArea: tot / kt, alternatives: calcAlternatives(rem, kt)
        };
        state.activeTab = 'results';
        renderApp();
        showNotification('Hesaplama tamamlandı', 'success');
      } catch (e) {
        console.error('Hesaplama hatası:', e);
        state.error = "Hesaplama hatası: " + e.message;
        renderApp();
      }
    }

    function calcAlternatives(rem, kat) {
      try {
        const alts = [];
        const maxUnits = Math.floor(rem / C.MIN);
        if (maxUnits < 1 || kat < 1) return [];
        for (let t = kat; t <= maxUnits; t += kat) {
          const net = rem / t;
          if (net >= C.MIN)
            alts.push({ totalUnits: t, unitsPerFloor: t / kat, netArea: net.toFixed(2), brutArea: calculateBrut(net), type: getType(net) });
        }
        return alts;
      } catch (e) { console.error('Alternatif hesaplama hatası:', e); return []; }
    }

    function toggleAlternativeSelection(index) {
      state.selectedAltIndexes = state.selectedAltIndexes.includes(index)
        ? state.selectedAltIndexes.filter(i => i !== index)
        : [...state.selectedAltIndexes, index];
      renderApp();
    }

    function showSelectedAlternatives() {
      if (!state.result?.alternatives) return;
      if (!state.selectedAltIndexes.length) { state.error = "Lütfen en az bir alternatif seçin"; renderApp(); return; }
      state.error = "";
      state.finalAlternatives = state.result.alternatives.filter((_, i) => state.selectedAltIndexes.includes(i));
      renderApp();
    }

    function quickSaveSelected() {
      if (!state.result?.alternatives) return;
      if (!state.selectedAltIndexes.length) { state.error = "Lütfen en az bir alternatif seçin"; renderApp(); return; }
      state.error = "";
      const selected = state.result.alternatives.filter((_, i) => state.selectedAltIndexes.includes(i));
      const lines = selected.map((alt, i) => formatAlternative(alt, i, state.kat, state.karmaList));
      if (!lines.length) lines.push("");
      const newEntryBase = { date: new Date().toLocaleString(), data: lines, kat: state.kat };

      if (state.files.length > 0) {
        const reader = new FileReader();
        reader.onload = e => {
          processHistoryData.push({ ...newEntryBase, image: e.target.result });
          state.history = getProcessHistory();
          state.files = [];
          saveToStorage(); renderApp();
          showNotification('İşlem kaydedildi', 'success');
        };
        reader.readAsDataURL(state.files[0]);
      } else {
        processHistoryData.push(newEntryBase);
        state.history = getProcessHistory();
        saveToStorage(); renderApp();
        showNotification('İşlem kaydedildi', 'success');
      }
    }

    function saveProcess() {
      if (!state.finalAlternatives?.length) { state.error = "Kaydedilecek bir alternatif yok!"; renderApp(); return; }
      state.error = "";
      const lines = state.finalAlternatives.map((alt, i) => formatAlternative(alt, i, state.kat, state.karmaList));
      if (!lines.length) lines.push("");
      const newEntryBase = { date: new Date().toLocaleString(), data: lines, kat: state.kat };

      if (state.files.length > 0) {
        const reader = new FileReader();
        reader.onload = e => {
          processHistoryData.push({ ...newEntryBase, image: e.target.result });
          state.history = getProcessHistory();
          state.files = [];
          saveToStorage(); renderApp();
          showNotification('İşlem kaydedildi', 'success');
        };
        reader.readAsDataURL(state.files[0]);
      } else {
        processHistoryData.push(newEntryBase);
        state.history = getProcessHistory();
        saveToStorage(); renderApp();
        showNotification('İşlem kaydedildi', 'success');
      }
    }

    function handleFileUpload(e) { state.files = Array.from(e.target.files); renderApp(); }

    function clearHistory() {
      state.history = clearProcessHistory();
      state.activeTab = 'form';
      renderApp();
      showNotification('Geçmiş temizlendi', 'info');
    }

    function deleteHistoryEntry(index) {
      const updated = [...state.history];
      updated.splice(index, 1);
      processHistoryData = updated;
      state.history = updated;
      if (state.editingHistoryIndex === index) state.editingHistoryIndex = -1;
      saveToStorage(); renderApp();
      showNotification('Kayıt silindi', 'info');
    }

    function exportData() {
      try {
        const data = { version: '1.0', exportDate: new Date().toISOString(), history: processHistoryData, mainInfo: state.mainInfo, karmaList: state.karmaList };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `emsal-hesaplama-${new Date().toISOString().split('T')[0]}.json`;
        link.click();
        URL.revokeObjectURL(url);
        showNotification('Veriler dışa aktarıldı', 'success');
      } catch (e) { console.error('Export hatası:', e); showNotification('Dışa aktarma hatası', 'error'); }
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const imported = JSON.parse(e.target.result);
          if (!imported.version) throw new Error('Geçersiz dosya formatı');
          if (imported.history) { processHistoryData = imported.history; state.history = imported.history; }
          if (imported.mainInfo) state.mainInfo = imported.mainInfo;
          if (imported.karmaList) state.karmaList = imported.karmaList;
          saveToStorage(); renderApp();
          showNotification('Veriler başarıyla içe aktarıldı', 'success');
        } catch (err) { console.error('Import hatası:', err); showNotification('İçe aktarma hatası: ' + err.message, 'error'); }
      };
      reader.onerror = () => showNotification('Dosya okuma hatası', 'error');
      reader.readAsText(file);
    }

    // ─── HISTORY EDITING ───
    let editBackup = null;

    function startEditingHistory(index) {
      editBackup = JSON.parse(JSON.stringify(state.history[index]));
      state.editingHistoryIndex = index;
      renderApp();
    }

    function cancelHistoryEdit() {
      if (editBackup && state.editingHistoryIndex >= 0) state.history[state.editingHistoryIndex] = editBackup;
      state.editingHistoryIndex = -1;
      editBackup = null;
      renderApp();
    }

    function saveHistoryEdit(index) {
      const titleInput = document.getElementById(`edit-title-${index}`);
      const contentTextarea = document.getElementById(`edit-content-${index}`);
      const imageInput = document.getElementById(`edit-image-${index}`);
      if (!titleInput || !contentTextarea) { cancelHistoryEdit(); return; }

      const updated = { ...state.history[index] };
      updated.title = titleInput.value.trim() || `Alternatif ${index + 1}`;
      const lines = contentTextarea.value.split('\n').filter(l => l !== null && l !== undefined);
      updated.data = lines.map(l => l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;'));
      if (!updated.data.length) updated.data = [''];

      if (imageInput?.files?.[0]) {
        const reader = new FileReader();
        reader.onload = e => {
          updated.image = e.target.result;
          state.history[index] = updated;
          processHistoryData[index] = updated;
          editBackup = null;
          state.editingHistoryIndex = -1;
          saveToStorage(); renderApp();
          showNotification('Kayıt ve görsel güncellendi', 'success');
        };
        reader.readAsDataURL(imageInput.files[0]);
      } else {
        state.history[index] = updated;
        processHistoryData[index] = updated;
        editBackup = null;
        state.editingHistoryIndex = -1;
        saveToStorage(); renderApp();
        showNotification('Kayıt güncellendi', 'success');
      }
    }

    // ─── ZOOM & DRAG ───
    function handleZoomWheel(e) {
      if (e.ctrlKey) {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 10 : -10;
        const newZoom = Math.max(50, Math.min(300, state.zoom + delta));
        if (newZoom !== state.zoom) { state.zoom = newZoom; updateZoomUI(e.currentTarget); }
      }
    }

    function updateZoomUI(container) {
      const content = container.querySelector('.image-content') || container.firstElementChild;
      if (content) {
        content.style.transform = `scale(${state.zoom / 100})`;
        content.style.width = state.zoom > 100 ? `${state.zoom}%` : '100%';
        content.style.height = state.zoom > 100 ? `${state.zoom}%` : '100%';
      }
    }

    function setupDraggable(container) {
      let isDragging = false, startX = 0, startY = 0, scrollLeft = 0, scrollTop = 0;
      let initialDistance = 0, initialZoom = 100;

      container.style.cursor = 'grab';

      container.addEventListener('mousedown', e => {
        isDragging = true;
        startX = e.pageX - container.offsetLeft;
        startY = e.pageY - container.offsetTop;
        scrollLeft = container.scrollLeft;
        scrollTop = container.scrollTop;
        container.style.cursor = 'grabbing';
      });

      container.addEventListener('mousemove', e => {
        if (!isDragging) return;
        e.preventDefault();
        container.scrollLeft = scrollLeft - ((e.pageX - container.offsetLeft) - startX) * 1.5;
        container.scrollTop = scrollTop - ((e.pageY - container.offsetTop) - startY) * 1.5;
      });

      const stopDrag = () => { isDragging = false; container.style.cursor = 'grab'; };
      container.addEventListener('mouseup', stopDrag);
      container.addEventListener('mouseleave', stopDrag);

      container.addEventListener('touchstart', e => {
        if (e.touches.length === 1) {
          isDragging = true;
          startX = e.touches[0].pageX - container.offsetLeft;
          startY = e.touches[0].pageY - container.offsetTop;
          scrollLeft = container.scrollLeft;
          scrollTop = container.scrollTop;
        } else if (e.touches.length === 2) {
          isDragging = false;
          initialDistance = Math.hypot(e.touches[1].pageX - e.touches[0].pageX, e.touches[1].pageY - e.touches[0].pageY);
          initialZoom = state.zoom;
        }
      });

      container.addEventListener('touchmove', e => {
        if (e.touches.length === 1 && isDragging) {
          e.preventDefault();
          container.scrollLeft = scrollLeft - ((e.touches[0].pageX - container.offsetLeft) - startX) * 1.5;
          container.scrollTop = scrollTop - ((e.touches[0].pageY - container.offsetTop) - startY) * 1.5;
        } else if (e.touches.length === 2) {
          e.preventDefault();
          const dist = Math.hypot(e.touches[1].pageX - e.touches[0].pageX, e.touches[1].pageY - e.touches[0].pageY);
          state.zoom = Math.min(Math.max(initialZoom * (dist / initialDistance), 50), 300);
          renderApp();
        }
      });

      container.addEventListener('touchend', e => { if (e.touches.length === 0) { isDragging = false; initialDistance = 0; } });
      container.addEventListener('wheel', handleZoomWheel);
      return container;
    }

    // ─── INIT ───
    loadFromStorage();
    renderApp();

    window.addEventListener('resize', debounce(() => renderApp(), 200));

    document.addEventListener('paste', function (e) {
      if (state.activeTab !== 'form') return;
      const target = e.target;
      if (target instanceof HTMLElement && (target.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].includes(target.tagName))) return;
      if (!e.clipboardData?.items) return;

      const items = Array.from(e.clipboardData.items);
      const fileItem = items.find(item => item.type.indexOf('image') !== -1 || item.type === 'application/pdf');
      if (!fileItem) return;

      const file = fileItem.getAsFile();
      if (!file) return;

      e.preventDefault();
      e.stopPropagation();
      state.files = [file];
      showNotification(file.type === 'application/pdf' ? 'PDF yapıştırıldı' : 'Görsel yapıştırıldı', 'success');
      renderApp();
    });
  </script>
</body>

</html>
